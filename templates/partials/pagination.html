{# Expects `paginator`, as provided to any template whose source sets paginate_by. #}
{% if paginator.number_pagers > 1 %}
    <nav class="pagination" aria-label="Pagination">
        {% if paginator.previous %}<a rel="prev" href="{{ paginator.previous | safe }}">← Newer</a>{% endif %}
        <span class="pagination-status">Page {{ paginator.current_index }} of {{ paginator.number_pagers }}</span>
        {% if paginator.next %}<a class="pagination-next" rel="next" href="{{ paginator.next | safe }}">Older →</a>{% endif %}
    </nav>
{% endif %}
